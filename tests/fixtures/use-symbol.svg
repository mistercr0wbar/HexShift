<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:sketch="http://www.bohemiancoding.com/sketch/ns" width="40" height="20" viewBox="0 0 40 20">
  <title>Shapes reused with use and symbol</title>
  <desc>Created with Sketch.</desc>
  <defs>
    <rect id="square" width="10" height="10"/>
    <symbol id="tile" viewBox="0 0 2 2">
      <rect width="2" height="2" fill="#2e7d32"/>
      <use href="#dot"/>
    </symbol>
    <circle id="dot" cx="1" cy="1" r="0.5" fill="#ffffff"/>
  </defs>
  <g sketch:type="MSArtboardGroup">
    <use xlink:href="#square" fill="#d32f2f"/>
    <use href="#square" x="10" fill="#1565c0"/>
    <use href="#tile" x="20" width="20" height="20"/>
  </g>
</svg>
