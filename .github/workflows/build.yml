name: Check, build and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hexshift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run build
      - name: Verify generated files are current
        run: git diff --exit-code -- HexShift.html sw.js
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
  windows-app:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore tests/native/HostTests.csproj --locked-mode -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet build tests/native/HostTests.csproj -c Release --no-restore
      - run: ./tests/native/bin/Release/net48/HostTests.exe
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HexShift
          path: |
            dist/
            HexShift.zip
            SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, windows-app]
    runs-on: windows-latest
    environment: release
    concurrency:
      group: hexshift-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Validate stable release tag
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$') {
            throw 'Release tags must be v followed by a stable major.minor.patch version (one to five digits per component, no leading zeros).'
          }
          "value=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_OUTPUT
      - run: dotnet restore app/HexShift.csproj --locked-mode -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet restore tests/native/HostTests.csproj --locked-mode -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet build tests/native/HostTests.csproj -c Release --no-restore
      - run: ./tests/native/bin/Release/net48/HostTests.exe
      - name: Package portable files and installer
        run: |
          $ErrorActionPreference = 'Stop'
          # installer.ps1 discovers installed ISCC 7 or 6 and throws a clear error
          # if neither is available. Never download a compiler here.
          ./scripts/package.ps1 -BuildInstaller -AppVersion $env:RELEASE_TAG.Substring(1)
      - name: Install pinned feed generator
        run: |
          dotnet tool install NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0 --tool-path "$env:RUNNER_TEMP\tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate signed update feed
        shell: pwsh
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SPARKLE_PUBLIC_KEY = (Get-Content -LiteralPath app/update-public-key.txt -Raw).Trim()
          $version = $env:RELEASE_TAG.Substring(1)
          $binaries = Join-Path $env:RUNNER_TEMP ('hexshift-installer-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $binaries | Out-Null
          Copy-Item -LiteralPath "dist/HexShift-$version-Setup.exe" -Destination $binaries
          & "$env:RUNNER_TEMP\tools\netsparkle-generate-appcast.exe" --binaries $binaries --ext exe `
            --output-type json --appcast-output-directory $env:GITHUB_WORKSPACE `
            --base-url "https://github.com/mistercr0wbar/HexShift/releases/download/v$version" `
            --product-name HexShift --os windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact release files before creating a draft
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./tests/native/bin/Release/net48/HostTests.exe verify-release `
            --feed appcast.json --signature appcast.json.signature `
            --key app/update-public-key.txt --exe dist/HexShift.exe `
            --installer "dist/HexShift-$version-Setup.exe" --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Append feed checksums
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('appcast.json', 'appcast.json.signature')) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Add-Content -LiteralPath SHA256SUMS.txt -Encoding utf8
          }
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/HexShift.exe
            dist/HexShift-${{ steps.version.outputs.value }}-Setup.exe
            HexShift.zip
            appcast.json
      - name: Create draft with all seven assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          $assets = @("dist/HexShift-$version-Setup.exe", 'appcast.json', 'appcast.json.signature',
            'SHA256SUMS.txt', 'dist/HexShift.exe', 'dist/HexShift.html', 'HexShift.zip')
          gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "Hex Shift $env:RELEASE_TAG" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          # release asset name -> the local file it was uploaded from
          $local = [ordered]@{
            "HexShift-$version-Setup.exe" = "dist/HexShift-$version-Setup.exe"
            'appcast.json' = 'appcast.json'
            'appcast.json.signature' = 'appcast.json.signature'
            'SHA256SUMS.txt' = 'SHA256SUMS.txt'
            'HexShift.exe' = 'dist/HexShift.exe'
            'HexShift.html' = 'dist/HexShift.html'
            'HexShift.zip' = 'HexShift.zip'
          }
          $json = gh release view $env:RELEASE_TAG --json assets,isDraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = ($json -join "`n") | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Expected a draft release.' }
          if (@($release.assets).Count -ne $local.Count) { throw 'The draft must contain exactly seven assets.' }
          foreach ($name in $local.Keys) {
            $asset = @($release.assets | Where-Object { $_.name -ceq $name })
            if ($asset.Count -ne 1) { throw "Missing or duplicate draft asset: $name" }
            $length = (Get-Item -LiteralPath $local[$name]).Length
            if ($length -le 0 -or $asset[0].size -ne $length) {
              throw "Draft asset $name is $($asset[0].size) bytes but the local file is $length bytes."
            }
          }
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify published latest feed and signature
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP ('hexshift-published-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $download | Out-Null
          foreach ($file in @('appcast.json', 'appcast.json.signature')) {
            $remote = Join-Path $download $file
            $expected = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            # GitHub can take a moment to move "latest" to a release that was just published,
            # so a mismatch is retried before it is reported.
            $actual = ''
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              Invoke-WebRequest -Uri "https://github.com/mistercr0wbar/HexShift/releases/latest/download/$file" -OutFile $remote
              $actual = (Get-FileHash -LiteralPath $remote -Algorithm SHA256).Hash
              if ($actual -ceq $expected) { break }
              if ($attempt -lt 6) { Start-Sleep -Seconds 10 }
            }
            if ($actual -cne $expected) { throw "Published latest $file SHA-256 mismatch: expected $expected, got $actual. The release is already public." }
            Write-Output "Published latest $file SHA-256 matches: $actual"
          }
      # Installed copies ask the website's addresses, not GitHub's. The website is deployed separately,
      # so this reports a problem without failing a release that is already public and correct.
      - name: Check the website's update addresses (informational)
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP ('hexshift-site-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $download | Out-Null
          foreach ($file in @('appcast.json', 'appcast.json.signature')) {
            $remote = Join-Path $download $file
            $expected = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            $actual = ''
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              try { Invoke-WebRequest -Uri "https://thecr0wbar.xyz/updates/hexshift/$file" -OutFile $remote; $actual = (Get-FileHash -LiteralPath $remote -Algorithm SHA256).Hash }
              catch { $actual = "request failed: $($_.Exception.Message)" }
              if ($actual -ceq $expected) { break }
              if ($attempt -lt 6) { Start-Sleep -Seconds 10 }
            }
            if ($actual -cne $expected) { throw "https://thecr0wbar.xyz/updates/hexshift/$file does not return this release's file ($actual). Installed copies check that address: deploy the website, then re-check." }
            Write-Output "Website address for $file matches the release: $actual"
          }
