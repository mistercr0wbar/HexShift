name: Check, build and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hexshift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run build
      - name: Verify generated files are current
        run: git diff --exit-code -- HexShift.html sw.js
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
  windows-app:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore tests/native/HostTests.csproj --locked-mode -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet build tests/native/HostTests.csproj -c Release --no-restore
      - run: ./tests/native/bin/Release/net48/HostTests.exe
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HexShift
          path: |
            dist/
            HexShift.zip
            SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, windows-app]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore app/HexShift.csproj --locked-mode -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet build app/HexShift.csproj -c Release --no-restore
      - run: ./scripts/package.ps1
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/HexShift.exe
            HexShift.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG dist/HexShift.exe dist/HexShift.html HexShift.zip SHA256SUMS.txt --verify-tag --title "Hex Shift $env:RELEASE_TAG" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  web:
    if: github.ref == 'refs/heads/main'
    needs: [checks, windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assemble the verified generated site
        run: |
          mkdir site
          cp HexShift.html site/index.html
          cp manifest.webmanifest sw.js site/
          cp -r icons site/icons
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
